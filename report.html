<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUGOP Visionary Portal</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="portalIframe" src="" allow="geolocation; microphone; camera"></iframe>

    <script>
        // 1. Base Google Apps Script URL
        const scriptBaseUrl = "https://script.google.com/macros/s/AKfycbwwSN3nPb9BTtblvnsPaG_r2WIAezI0L045IGvucUJ9h6WLiZkcfEiTqUCd6BSeFcm_/exec";

        // 2. Grab full query string from URL (e.g., ?school=bangula&name=John&class=Form+4...)
        const currentParams = window.location.search;

        // 3. Attach parameters to iframe URL
        document.getElementById('portalIframe').src = scriptBaseUrl + currentParams;
    </script>

</body>
</html>
